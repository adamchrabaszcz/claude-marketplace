name: test

# Validates the marketplace and every plugin's manifest with Claude Code's own validator, pinned
# to an exact version (Dependabot doesn't update it; move it when a newer validator matters).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.289
      - name: Validate the marketplace and its plugins
        run: claude plugin validate .
      - name: No plugin version (docs/adr/0002-plugins-follow-main.md)
        # A version would freeze every user on it until someone bumps it. Explicit ifs, because
        # bash -e ignores a failing command that starts with "!".
        run: |
          if jq -e '.plugins[] | select(has("version"))' .claude-plugin/marketplace.json >/dev/null; then
            echo "::error file=.claude-plugin/marketplace.json::A plugin entry has a version; plugins follow main (docs/adr/0002)."; exit 1
          fi
          if grep -l '"version"' plugins/*/.claude-plugin/plugin.json; then
            echo "::error::The plugin.json files above have a version; plugins follow main (docs/adr/0002)."; exit 1
          fi
