name: release

# Once CI has passed on a push to main, this tags the commit and publishes a GitHub release if
# the merges since the last release shipped something (CONTRIBUTING.md, "Releases").
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
      issues: write # milestones and comments on what shipped
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the tags and the commits since the last one
      - uses: adamchrabaszcz/github-steward-actions/release@735258dd549b212c92c664873667121c1b4e1a98 # v1.0.0
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
