name: claude-review

# An AI review of each pull request by Claude Code when it's opened or marked ready for review,
# not on every push, to save usage: bugs, security issues, edge cases, breaking changes.
# `@claude review` in a comment asks for another pass (claude.yml). Runs on the owner's Claude
# subscription (secret CLAUDE_CODE_OAUTH_TOKEN). Based on the action's official example
# examples/pr-review-comprehensive.yml.
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait until they're ready. Dependabot's pull requests and those from forks get no
    # secrets, so the review couldn't run for them.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Review
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues, edge cases and breaking changes.
            Follow AGENTS.md (its "Code review" section first), CONTRIBUTING.md,
            docs/architecture.md and the decisions in docs/adr/. A change that goes against an
            accepted decision without a new record superseding it is "**should fix**".

            Check the pull request against the definition of done in CONTRIBUTING.md: it closes
            exactly one issue, a test fails without the change, the docs it makes wrong are
            updated, there is no personal data and no secret, and the title is a Conventional
            Commit of the right type.

            Skip what the tests already catch.

            Post an inline comment on each specific problem, starting with its severity:
            "**blocking**" (must change before merging), "**should fix**" or "**nit**".

            Then post one short summary comment: a checklist with one line per review point
            from AGENTS.md's "Code review" section and the definition of done, leaving out the
            points that don't apply to this change. "- [x] <point>: <why it's fine>" for a point
            that passes, "- [ ] <point>: <what needs attention>" for one that doesn't, the
            details in its inline comment. End with a verdict: "**Ready to merge**", or
            "**Changes needed**" followed by the open points. Never approve or request changes
            as a GitHub review: merging is the owner's decision.

            If there is nothing important, the checklist is all ticked and short; don't invent
            issues.
          # The newest Opus for the subtle problems; "sonnet" uses the subscription's limits
          # more slowly. --max-turns caps a run, so one review can't use the limits up.
          claude_args: |
            --model opus
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
